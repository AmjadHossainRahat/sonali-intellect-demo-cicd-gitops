apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonali-intellect-demo
  labels:
    app.kubernetes.io/name: sonali-intellect-demo-cicd-gitops
    app.kubernetes.io/part-of: sonali-intellect-training
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sonali-intellect-demo-cicd-gitops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonali-intellect-demo-cicd-gitops
        app.kubernetes.io/part-of: sonali-intellect-training
    spec:
      serviceAccountName: sonali-intellect-demo
      imagePullSecrets:
        - name: harbor-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: demo.goharbor.io/si_demo_harbor/sonali-intellect-demo-cicd-gitops:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "0.1.0"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 18
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

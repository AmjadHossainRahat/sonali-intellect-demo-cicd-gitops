spring:
  application:
    name: sonali-intellect-demo-cicd-gitops

server:
  port: 8080

app:
  version: ${APP_VERSION:0.1.0}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true


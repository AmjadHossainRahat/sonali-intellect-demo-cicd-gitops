name: 02 - Release Image to Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: none
  id-token: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: sonali-intellect-demo-cicd-gitops

jobs:
  publish:
    name: Build Once, Scan, and Publish
    runs-on: ubuntu-24.04
    outputs:
      image-digest: ${{ steps.digest.outputs.digest }}
      image-ref: ${{ steps.digest.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B clean test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY || secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || secrets.HARBOR_PROJECT }}

      - name: Build image locally for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}

      - name: Scan final image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_REGISTRY || secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push image
        run: docker push "${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}"

      - name: Resolve digest
        id: digest
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect "${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          image_ref="${{ steps.meta.outputs.repository }}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${image_ref}" > image-digest.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ github.sha }}
          path: image-digest.txt
